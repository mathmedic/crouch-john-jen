<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Random Groups &amp; Means</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mute:#667;--line:#ddd9cf;--a:#2a6fdb;--b:#d9622b;--ac:#e8f0fd;--bc:#fcece3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#202226;--ink:#eceae4;--mute:#9a9a9a;--line:#34363b;--a:#6aa3ff;--b:#ff9a66;--ac:#1d2a40;--bc:#3a261b}}
:root[data-theme="dark"]{--bg:#17181b;--card:#202226;--ink:#eceae4;--mute:#9a9a9a;--line:#34363b;--a:#6aa3ff;--b:#ff9a66;--ac:#1d2a40;--bc:#3a261b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{font-weight:600;display:block;margin-bottom:6px}
textarea{width:100%;box-sizing:border-box;min-height:70px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=number]{width:70px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:0;background:var(--a);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.note{color:var(--mute);font-size:.9rem}.err{color:#c0392b;font-size:.9rem}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.groups{grid-template-columns:1fr}}
.g{border-radius:12px;padding:14px}.g.a{background:var(--ac)}.g.b{background:var(--bc)}
.g h2{margin:0 0 6px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{min-width:26px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-weight:600}
.mean{font-size:1.6rem;font-weight:700}
.a .mean{color:var(--a)}.b .mean{color:var(--b)}
.diff{text-align:center;margin-top:12px;font-size:1.1rem}
.tblwrap{overflow-x:auto}table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
</style>
</head>
<body>
<main>
<h1>Random Groups &amp; Means</h1>
<p class="sub">Randomly divide the class ratings into two groups and compare the group means.</p>

<div class="card">
<label for="in">Class ratings (1–7), separated by spaces, commas, or new lines</label>
<textarea id="in" placeholder="e.g. 5 3 7 4 6 2 ..."></textarea>
<div class="row"><span id="info" class="note"></span>
<span>Group 1 size: <input type="number" id="sz" min="1" step="1"></span></div>
<div id="err" class="err"></div>
<div class="row" id="teacher" hidden="">
<button class="alt" id="share">Share these ratings with the class</button>
<span class="note" id="shareNote">Teacher only: everyone with the page open reloads with the ratings loaded.</span></div>
</div>

<div class="card">
<div class="row" style="margin-top:0"><button id="go">Randomly divide!</button>
<button class="alt" id="clear">Clear history</button></div>
<div id="out" style="margin-top:14px"></div>
</div>

<div class="card" id="histcard" hidden="">
<label>Your results so far</label>
<div class="tblwrap"><table><thead><tr><th>#</th><th>Group 1 mean</th><th>Group 2 mean</th><th>Difference (1 − 2)</th></tr></thead><tbody id="hist"></tbody></table></div>
</div>
</main>
<script>
const PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const SAVED=/*D*/[7,4,5,7,3,1,1,3,3,7,6,3,5,7,6,6,7,3,1,3,7,6,5,4,2,7,3,3,6,6]/*E*/;
const $=id=>document.getElementById(id);
let vals=[],hist=[];
function parse(){
  const t=$('in').value.trim();
  const toks=t?t.split(/[\s,;]+/).filter(Boolean):[];
  const nums=toks.map(Number);
  const bad=nums.filter(x=>!Number.isFinite(x)||x<1||x>7);
  vals=nums.filter(x=>Number.isFinite(x)&&x>=1&&x<=7);
  $('err').textContent=bad.length?bad.length+' entr'+(bad.length>1?'ies':'y')+' ignored (not a number from 1 to 7).':'';
  $('info').textContent=vals.length+' rating'+(vals.length===1?'':'s');
  const s=$('sz');s.max=Math.max(vals.length-1,1);
  if(!s.dataset.touched||+s.value>=vals.length)s.value=Math.floor(vals.length/2)||1;
}
function rnd(n){const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const f=x=>x.toFixed(2);
function group(cls,name,a){
  return '<div class="g '+cls+'"><h2>'+name+' (n = '+a.length+')</h2><div class="chips">'+
  a.map(x=>'<span class="chip">'+x+'</span>').join('')+'</div><div>Mean</div><div class="mean">'+f(mean(a))+'</div></div>';
}
function go(){
  parse();
  if(vals.length<2){$('out').innerHTML='<p class="err">Enter at least 2 ratings first.</p>';return}
  let k=Math.round(+$('sz').value);k=Math.min(Math.max(k,1),vals.length-1);$('sz').value=k;
  const sh=shuffle(vals),A=sh.slice(0,k).sort((x,y)=>x-y),B=sh.slice(k).sort((x,y)=>x-y);
  const d=mean(A)-mean(B);
  $('out').innerHTML='<div class="groups">'+group('a','Group 1',A)+group('b','Group 2',B)+'</div><div class="diff">Difference in means (Group 1 − Group 2): <b>'+f(d)+'</b></div>';
  hist.push([mean(A),mean(B),d]);drawHist();
}
function drawHist(){
  $('histcard').hidden=!hist.length;
  $('hist').innerHTML=hist.map((h,i)=>'<tr><td>'+(i+1)+'</td><td>'+f(h[0])+'</td><td>'+f(h[1])+'</td><td>'+f(h[2])+'</td></tr>').reverse().join('');
}
$('in').addEventListener('input',parse);
$('sz').addEventListener('input',()=>{$('sz').dataset.touched=1});
$('go').addEventListener('click',go);
$('clear').addEventListener('click',()=>{hist=[];drawHist();$('out').innerHTML=''});
if(SAVED.length)$('in').value=SAVED.join(' ');
parse();

(async()=>{
  try{
    const user=await claude.use('user'),art=await claude.use('artifact');
    if(!art||!(user&&user.isOwner()))return;
    $('teacher').hidden=false;
    $('share').addEventListener('click',async()=>{
      parse();
      if(vals.length<2){$('shareNote').textContent='Enter ratings first.';return}
      const html=PRISTINE.replace(/\/\*D\*\/[^]*?\/\*E\*\//,()=>'/*D*/'+JSON.stringify(vals)+'/*E*/');
      try{await art.publish(html)}catch(e){$('shareNote').textContent='Could not publish: '+(e&&e.code||'error')}
    });
  }catch(e){}
})();
</script></body></html>
